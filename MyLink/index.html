<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이링크 - 한우진</title>
  <meta name="description" content="나만의 링크 페이지를 30분 만에!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="마이링크 - 한우진">
  <meta property="og:description" content="나만의 링크 페이지를 30분 만에!">
  <meta property="og:url" content="https://wwjj2424-del.github.io/mylink/MyLink/">
  <meta property="og:image" content="https://wwjj2424-del.github.io/mylink/MyLink/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <main class="card profile">
      <img class="profile-img" src="profile.png" alt="프로필 이미지">
      <h1 id="display-name"></h1>
      <p class="username" id="username"></p>
      <p class="bio" id="bio"></p>
      <ul class="links" id="links"></ul>
    </main>

    <section class="card stats" id="stats" aria-labelledby="stats-title">
      <h2 id="stats-title">클릭 통계</h2>
      <p class="total"><strong data-total>0</strong>클릭</p>
      <div data-stat-list></div>
      <p class="note">클릭 수는 이 브라우저에 저장됩니다.</p>
    </section>

    <footer>
      MyLink · 아이디어를 현실로 - 바이브 코딩 ·
      <a href="mypage.html">내 링크 관리</a> ·
      <a href="https://github.com/wwjj2424-del/mylink" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script>
    const profile = MyLinkData.getProfile();
    document.getElementById("display-name").textContent = profile.displayName;
    document.getElementById("username").textContent = profile.username ? `@${profile.username}` : "";
    document.getElementById("bio").textContent = profile.bio;

    const stats = document.getElementById("stats");
    const list = document.getElementById("links");

    function render() {
      const links = MyLinkData.getLinks();
      const clicks = MyLinkData.getClicks();
      list.replaceChildren();

      if (links.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "아직 등록된 링크가 없어요.";
        list.appendChild(empty);
      }

      links.forEach(link => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "link";
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener";

        const icon = document.createElement("span");
        icon.className = "link-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = MyLinkUI.icon(link.icon);
        const title = document.createElement("span");
        title.className = "link-title";
        title.textContent = link.title;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = `클릭 ${clicks[link.id] || 0}`;

        a.append(icon, title, count);
        a.addEventListener("click", () => {
          count.textContent = `클릭 ${MyLinkData.addClick(link.id)}`;
          MyLinkUI.renderStats(stats, MyLinkData.getLinks(), MyLinkData.getClicks());
        });

        li.appendChild(a);
        list.appendChild(li);
      });

      MyLinkUI.renderStats(stats, links, clicks);
    }

    render();
  </script>
</body>
</html>
