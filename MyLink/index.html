<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이링크 | 한우진</title>
  <meta name="description" content="한우진의 링크 모음 페이지">
  <meta property="og:title" content="마이링크 | 한우진">
  <meta property="og:description" content="한 페이지에 모은 나의 링크">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #eef7f0;
      --card: #ffffff;
      --text: #1f2d24;
      --muted: #5f7266;
      --accent: #2fb37a;
      --accent-dark: #1f8a5c;
      --border: #d6e9dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121a15;
        --card: #1b2620;
        --text: #e6f2ea;
        --muted: #9db5a6;
        --accent: #3cc98a;
        --accent-dark: #2fb37a;
        --border: #2a3a31;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main { width: 100%; max-width: 480px; text-align: center; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent), #6fd3a6);
      color: #fff; font-size: 40px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .bio { margin: 0 0 32px; color: var(--muted); font-size: 15px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text); text-decoration: none; font-weight: 600;
      transition: transform .15s, border-color .15s;
    }
    a.link:hover { transform: translateY(-2px); border-color: var(--accent); }
    .count { font-size: 12px; font-weight: 500; color: var(--muted); }
    footer { margin-top: 40px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="avatar">우</div>
    <h1>한우진</h1>
    <p class="bio">바이브 코딩으로 만든 나의 링크 모음</p>

    <ul id="links"></ul>

    <footer>MyLink · 아이디어를 현실로 - 바이브 코딩</footer>
  </main>

  <script>
    // 링크 목록: 여기만 수정하면 페이지에 반영됩니다.
    const links = [
      { id: "github", title: "GitHub 프로필", url: "https://github.com/wwjj2424-del" },
      { id: "source", title: "마이링크 소스 코드", url: "https://github.com/wwjj2424-del/mylink/tree/main/MyLink" },
      { id: "course", title: "바이브 코딩 강의 (SELC)", url: "https://selc.or.kr/" }
    ];

    // 클릭 통계: 이 브라우저에서 각 링크를 누른 횟수를 저장합니다.
    function getClicks() {
      try { return JSON.parse(localStorage.getItem("mylink-clicks")) || {}; }
      catch (e) { return {}; }
    }
    function saveClicks(clicks) {
      try { localStorage.setItem("mylink-clicks", JSON.stringify(clicks)); } catch (e) {}
    }

    const list = document.getElementById("links");
    const clicks = getClicks();

    links.forEach(link => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "link";
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener";

      const title = document.createElement("span");
      title.textContent = link.title;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `클릭 ${clicks[link.id] || 0}`;

      a.append(title, count);
      a.addEventListener("click", () => {
        clicks[link.id] = (clicks[link.id] || 0) + 1;
        saveClicks(clicks);
        count.textContent = `클릭 ${clicks[link.id]}`;
      });

      li.appendChild(a);
      list.appendChild(li);
    });
  </script>
</body>
</html>
